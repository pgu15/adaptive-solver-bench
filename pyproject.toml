[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-solver-bench"
version = "0.1.0"
description = "Benchmarking adaptive preconditioner selection for iterative sparse solvers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pyamg>=5.0"]

[project.optional-dependencies]
real = ["ssgetpy>=1.0"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
asbench = "asbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
